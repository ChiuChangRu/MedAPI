name: 部署到 Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/**"
      # 這個 workflow 自己改動時也要跑一次，否則「改好了但沒觸發」會看起來像沒修好
      - ".github/workflows/deploy.yml"
  workflow_dispatch: # 可在 GitHub Actions 頁面手動選任一分支手動部署（合併到 main 前想先測試時用）

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          # 一定要指定版本：wrangler-action@v3 預設裝 3.90.0，而 wrangler 要到
          # 3.91.0 才看得懂 wrangler.jsonc（.jsonc 副檔名）。沒有這一行的話它
          # 完全讀不到設定檔，會以「Missing entry-point（找不到 main）」失敗——
          # 這正是 2026-08-05 建立這個 workflow 以來每一次部署都掛掉的原因。
          wranglerVersion: "4.120.1"
          command: deploy

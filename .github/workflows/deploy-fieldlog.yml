name: 部署 Fieldlog 到 Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "fieldlog/**"
      - ".github/workflows/deploy-fieldlog.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-fieldlog-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Fieldlog Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: fieldlog
          wranglerVersion: "4.113.0"
          command: deploy --keep-vars

      # v142 母體整理只由後台 Workflow 執行，不依賴 Cloud Browser／Access 登入。
      # Workflow 會在 D1 settings 凍結母體最大 ID 並寫入完成標記；之後部署即使
      # 再觸發，也只會 skipped，不會把新資料納入這次整理。
      - name: Trigger and verify one-time existing filing review
        working-directory: fieldlog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          instance_id="baseline-filing-v142-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          npx --yes wrangler@4.113.0 workflows trigger fieldlog-embedding-workflow \
            '{"kind":"baseline_filing_v142","batch_limit":25,"max_batches":40}' \
            --id "$instance_id"
          for attempt in $(seq 1 60); do
            output="$(npx --yes wrangler@4.113.0 workflows instances describe \
              fieldlog-embedding-workflow "$instance_id" --step-output=false 2>&1)"
            echo "$output"
            if echo "$output" | grep -qi "complete"; then
              exit 0
            fi
            if echo "$output" | grep -Eqi "errored|terminated"; then
              exit 1
            fi
            sleep 10
          done
          echo "母體整理超過 10 分鐘仍未完成"
          exit 1

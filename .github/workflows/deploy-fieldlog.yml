name: 部署 Fieldlog 到 Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "fieldlog/**"
      - ".github/workflows/deploy-fieldlog.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-fieldlog-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # v167 的 app.js 仍含 iOS hidden => stopAudio() 舊邏輯。先前把 hotfix 放在
      # richtext-editor.js 會因為它比 app.js 早載入而被 app.js 覆蓋，實際無效。
      # 部署前把修正附加在 app.js 最後（init() 之後），確保 runtime 真正覆寫
      # onPageHidden。待 app.js 正式重構後可移除此相容層。
      - name: Apply iOS background-audio runtime patch
        working-directory: fieldlog
        shell: bash
        run: |
          printf '\n\n' >> public/app.js
          cat public/background-audio-fix.js >> public/app.js
          grep -q "background-audio best-effort patch active" public/app.js

      - name: Deploy Fieldlog Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: fieldlog
          wranglerVersion: "4.113.0"
          command: deploy --keep-vars

      - name: Trigger and verify one-time existing filing review
        working-directory: fieldlog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          instance_id="baseline-filing-v142-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          npx --yes wrangler@4.113.0 workflows trigger fieldlog-embedding-workflow \
            '{"kind":"baseline_filing_v142","batch_limit":25,"max_batches":40}' \
            --id "$instance_id"
          for attempt in $(seq 1 60); do
            output="$(npx --yes wrangler@4.113.0 workflows instances describe \
              fieldlog-embedding-workflow "$instance_id" --step-output=false 2>&1)"
            echo "$output"
            if echo "$output" | grep -qi "complete"; then exit 0; fi
            if echo "$output" | grep -Eqi "errored|terminated"; then exit 1; fi
            sleep 10
          done
          echo "母體整理超過 10 分鐘仍未完成"
          exit 1

      - name: Normalize and verify existing child folder names
        working-directory: fieldlog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          instance_id="folder-names-v143-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          npx --yes wrangler@4.113.0 workflows trigger fieldlog-embedding-workflow \
            '{"kind":"normalize_folder_names_v143"}' \
            --id "$instance_id"
          for attempt in $(seq 1 30); do
            output="$(npx --yes wrangler@4.113.0 workflows instances describe \
              fieldlog-embedding-workflow "$instance_id" --step-output=true 2>&1)"
            echo "$output"
            if echo "$output" | grep -qi "complete"; then exit 0; fi
            if echo "$output" | grep -Eqi "errored|terminated"; then exit 1; fi
            sleep 10
          done
          echo "資料夾名稱整理超過 5 分鐘仍未完成"
          exit 1

      - name: Normalize and verify work sections
        working-directory: fieldlog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          instance_id="work-sections-v144-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          npx --yes wrangler@4.113.0 workflows trigger fieldlog-embedding-workflow \
            '{"kind":"normalize_work_sections_v144"}' \
            --id "$instance_id"
          for attempt in $(seq 1 30); do
            output="$(npx --yes wrangler@4.113.0 workflows instances describe \
              fieldlog-embedding-workflow "$instance_id" --step-output=true 2>&1)"
            echo "$output"
            if echo "$output" | grep -qi "complete"; then exit 0; fi
            if echo "$output" | grep -Eqi "errored|terminated"; then exit 1; fi
            sleep 10
          done
          echo "工作分類整理超過 5 分鐘仍未完成"
          exit 1

name: 部署 MyWiki 唯讀分享站

on:
  push:
    branches: [codex/kiwi-integration]
    paths: ["share/**", ".github/workflows/deploy-share.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-myw-share-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy share Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: share
          wranglerVersion: "4.113.0"
          command: deploy
